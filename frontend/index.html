<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Ni maximum-scale ni user-scalable=no : ils interdisaient le zoom à deux
         doigts, donc empêchaient une vendeuse presbyte d'agrandir son tableau de
         bord. Ils servaient à éviter le zoom iOS au focus d'un champ, qui ne se
         produit pas ici : tous les champs héritent d'une taille de 16 px. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / Mobile App Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DjassaBot" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <meta name="description" content="DjassaBot répond à vos clients sur WhatsApp, négocie et prend les commandes, à votre image et selon vos règles. Pour les commerçants de Côte d'Ivoire." />
    <title>DjassaBot — Votre vendeur IA sur WhatsApp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
